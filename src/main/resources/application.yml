# Configuração única para todos os ambientes: os valores vêm de variáveis de ambiente
# (docker-compose localmente, Render em staging/produção). Veja .env.example.
spring:
  application:
    name: movesaude-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movesaude}
    username: ${DB_USER:movesaude}
    password: ${DB_PASSWORD:movesaude}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:movesaude}
  jackson:
    deserialization:
      # Campos booleanos/numéricos omitidos no JSON assumem o valor padrão (false/0)
      fail-on-null-for-primitives: false
  flyway:
    schemas: ${DB_SCHEMA:movesaude}
    default-schema: ${DB_SCHEMA:movesaude}
    create-schemas: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    nome: MoveSaúde API
    ambiente: ${movesaude.ambiente}

movesaude:
  ambiente: ${APP_ENV:local}
  # No Render, RENDER_GIT_COMMIT é preenchido automaticamente; na imagem Docker, APP_COMMIT vem do build.
  commit: ${APP_COMMIT:${RENDER_GIT_COMMIT:desconhecido}}
  comissao: 0.18

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
